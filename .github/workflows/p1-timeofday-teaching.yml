name: P1 Time of the Day teaching patch

on:
  push:
    paths:
      - '.github/workflows/p1-timeofday-teaching.yml'
      - 'scripts/p1_timeofday_patch.py'
      - 'scripts/p1_timeofday_patch_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P1 Time of the Day changes
        run: python scripts/p1_timeofday_patch_runner.py

      - name: Rebuild shared engine bundle
        run: node scripts/assemble-engines.mjs

      - name: Trace Time generation state
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import vm from 'node:vm';
          import * as source from './engine-src/core.mjs';
          const html=await readFile('./public/time.html','utf8');
          const core=html.slice(html.indexOf('const ENGINE_NAMES'),html.indexOf('const $=id=>'));
          const deployed=vm.runInNewContext(`${core}\n({defaults,validate,lesson,generatedConfig})`);
          let seed=9367;
          const rng=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
          for (const [name,api] of [['SOURCE',source],['DEPLOYED',deployed]]) {
            const before=api.validate({...api.defaults('time',3,'duration'),mode:'fixed',count:1,startTime:'2345',endTime:'0015'});
            console.log(name,'BEFORE',before.startTime,before.endTime,before.mode,api.lesson(before).answer);
            const random=api.validate({...api.defaults('time',1,'timeofday'),mode:'random',count:8});
            for(let i=0;i<80;i++){
              const generated=api.validate({...api.generatedConfig(random,rng),mode:'fixed'});
              api.lesson(generated);
            }
            const after=api.validate({...api.defaults('time',3,'duration'),mode:'fixed',count:1,startTime:'2345',endTime:'0015'});
            console.log(name,'AFTER',after.startTime,after.endTime,after.mode,after.duration,api.lesson(after).answer);
          }
          NODE

      - name: Verify Time engine
        run: node checks/check-time-day.mjs

      - name: Commit generated teaching update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-src/core.mjs engine-src/runtime.js engine-src/theme.css public/time.html public/engines.html app/api/download/template.ts checks/check-time-day.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refocus P1 Time of the Day on analogue clock reading"
          git push
