name: P1 Time of the Day teaching patch

on:
  push:
    paths:
      - '.github/workflows/p1-timeofday-teaching.yml'
      - 'scripts/p1_timeofday_patch.py'
      - 'scripts/p1_timeofday_patch_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P1 Time of the Day changes
        run: python scripts/p1_timeofday_patch_runner.py

      - name: Rebuild shared engine bundle
        run: node scripts/assemble-engines.mjs

      - name: Instrument regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('checks/check-time-day.mjs')
          s=p.read_text()
          old="  assert.deepEqual(plain(elapsed.answer), [0,30]);"
          new="  console.log('CHECK-P3', api===source?'SOURCE':'DEPLOYED', p3.startTime, p3.endTime, p3.mode, elapsed.answer);\n"+old
          if old not in s: raise SystemExit('P3 assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          nl -ba checks/check-time-day.mjs | sed -n '46,53p'

      - name: Verify Time engine
        run: node checks/check-time-day.mjs

      - name: Commit generated teaching update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-src/core.mjs engine-src/runtime.js engine-src/theme.css public/time.html public/engines.html app/api/download/template.ts checks/check-time-day.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refocus P1 Time of the Day on analogue clock reading"
          git push
