name: P1 Time of the Day teaching patch

on:
  push:
    paths:
      - '.github/workflows/p1-timeofday-teaching.yml'
      - 'scripts/p1_timeofday_patch.py'
      - 'scripts/p1_timeofday_patch_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P1 Time of the Day changes
        run: python scripts/p1_timeofday_patch_runner.py

      - name: Rebuild shared engine bundle
        run: node scripts/assemble-engines.mjs

      - name: Diagnose P3 elapsed-time preservation
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import vm from 'node:vm';
          import * as source from './engine-src/core.mjs';
          const input={...source.defaults('time',3,'duration'),mode:'fixed',count:1,startTime:'2345',endTime:'0015'};
          const sc=source.validate(input), sl=source.lesson(sc);
          console.log('SOURCE CONFIG', sc.startTime, sc.endTime, sc.task, sc.grade, sc.mode, 'ANSWER', sl.answer);
          const html=await readFile('./public/time.html','utf8');
          const core=html.slice(html.indexOf('const ENGINE_NAMES'),html.indexOf('const $=id=>'));
          const deployed=vm.runInNewContext(`${core}\n({defaults,validate,lesson})`);
          const dc=deployed.validate({...deployed.defaults('time',3,'duration'),mode:'fixed',count:1,startTime:'2345',endTime:'0015'}), dl=deployed.lesson(dc);
          console.log('DEPLOYED CONFIG', dc.startTime, dc.endTime, dc.task, dc.grade, dc.mode, 'ANSWER', dl.answer);
          NODE

      - name: Verify Time engine
        run: node checks/check-time-day.mjs

      - name: Commit generated teaching update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-src/core.mjs engine-src/runtime.js engine-src/theme.css public/time.html public/engines.html app/api/download/template.ts checks/check-time-day.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refocus P1 Time of the Day on analogue clock reading"
          git push
