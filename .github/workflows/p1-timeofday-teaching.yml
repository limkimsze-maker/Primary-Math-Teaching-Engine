name: P1 Time of the Day teaching patch

on:
  push:
    paths:
      - '.github/workflows/p1-timeofday-teaching.yml'
      - 'scripts/p1_timeofday_patch.py'
      - 'scripts/p1_timeofday_patch_runner.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P1 Time of the Day changes
        run: python scripts/p1_timeofday_patch_runner.py
      - name: Rebuild shared engine bundle
        run: node scripts/assemble-engines.mjs
      - name: Trace deployed answer-check state
        run: |
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          import vm from 'node:vm';
          const html=await readFile('./public/time.html','utf8');
          const core=html.slice(html.indexOf('const ENGINE_NAMES'),html.indexOf('const $=id=>'));
          const api=vm.runInNewContext(`${core}\n({defaults,validate,lesson,checkAnswer,generatedConfig})`);
          let seed=9367; const rng=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
          const show=(tag)=>{const x=api.defaults('time',3,'duration'); console.log(tag,'DEFAULT P3 MODE',x.mode,x.startTime,x.endTime);};
          show('BEFORE');
          const random=api.validate({...api.defaults('time',1,'timeofday'),mode:'random',count:8});
          const generated=api.validate({...api.generatedConfig(random,rng),mode:'fixed'});
          const activity=api.lesson(generated);
          console.log('P1',generated.mode,generated.startTime,activity.answer);
          show('AFTER LESSON');
          console.log('CHECK',api.checkAnswer(activity,JSON.parse(JSON.stringify(activity.answer)),{}));
          show('AFTER CHECK');
          for(let i=0;i<79;i++){
            const g=api.validate({...api.generatedConfig(random,rng),mode:'fixed'});
            const a=api.lesson(g); api.checkAnswer(a,JSON.parse(JSON.stringify(a.answer)),{});
          }
          show('AFTER 80 CHECKS');
          const p3=api.validate({...api.defaults('time',3,'duration'),startTime:'2345',endTime:'0015'});
          console.log('P3 FINAL',p3.mode,p3.startTime,p3.endTime,api.lesson(p3).answer);
          NODE
      - name: Stop after diagnosis
        run: exit 1
