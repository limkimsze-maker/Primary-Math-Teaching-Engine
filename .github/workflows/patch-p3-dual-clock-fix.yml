name: Fix P3 dual seconds clock patch

on:
  push:
    paths:
      - '.github/workflows/patch-p3-dual-clock-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected P3 Time patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = Path('.github/workflows/patch-p3-dual-clock.yml').read_text()
          m = re.search(r"css = r'''(.*?)'''\n\n          js = r'''(.*?)'''", old, re.S)
          if not m:
              raise SystemExit('Could not recover clock CSS/JS from first patch workflow')
          css, js = m.group(1), m.group(2)

          theme = Path('engine-src/theme.css')
          t = theme.read_text()
          if 'P3_DUAL_SECONDS_CLOCK_V1' not in t:
              theme.write_text(t + '\n' + css + '\n')

          runtime = Path('engine-src/runtime.js')
          r = runtime.read_text()
          if 'P3_DUAL_SECONDS_CLOCK_V1' not in r:
              runtime.write_text(r + '\n' + js + '\n')

          timefile = Path('public/time.html')
          h = timefile.read_text()
          if 'P3_DUAL_SECONDS_CLOCK_V1' not in h:
              style_close = h.find('</style>')
              if style_close < 0:
                  raise SystemExit('Could not find style block in public/time.html')
              h = h[:style_close] + css + h[style_close:]
              needle = "const $=id=>document.getElementById(id);"
              code_pos = h.find(needle)
              if code_pos < 0:
                  raise SystemExit('Could not find runtime code in public/time.html')
              pos = h.rfind('<script', 0, code_pos)
              if pos < 0:
                  raise SystemExit('Could not find runtime script tag in public/time.html')
              h = h[:pos] + '<script>' + js + '</script>' + h[pos:]
              timefile.write_text(h)

          index = Path('index.html')
          i = index.read_text()
          i = i.replace('fix=20260928-period-label-lanes-1&tts=', 'fix=20261007-p3-dual-clock-seconds-1&tts=')
          index.write_text(i)
          PY
          node scripts/assemble-engines.mjs
          rm -f .github/workflows/patch-p3-dual-clock.yml .github/workflows/patch-p3-dual-clock-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-src/theme.css engine-src/runtime.js public/time.html public/engines.html app/api/download/template.ts index.html .github/workflows/patch-p3-dual-clock.yml .github/workflows/patch-p3-dual-clock-fix.yml
          git commit -m "Add P3 analogue and digital seconds clock"
          git push
