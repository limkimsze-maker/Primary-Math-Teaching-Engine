name: Add P3 Time clocks with second hand

on:
  push:
    paths:
      - '.github/workflows/add-p3-clock-second-hand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add stable P3 second-hand clock subtopic
        run: |
          python3 .github/scripts/add-p3-clock-second-hand.py
          node --check engine-src/runtime.js
          node --check engine-src/core.mjs
          node scripts/assemble-engines.mjs
          grep -q "2 · Clocks with Second hand" engine-src/core.mjs
          grep -q "2 · Clocks with Second hand" public/time.html
          grep -q "2 · Clocks with Second hand" public/engines.html
          ! grep -q "P3_DUAL_SECONDS_CLOCK" public/time.html
          ! grep -q "P3_DUAL_SECONDS_CLOCK" engine-src/runtime.js
          rm -f .github/workflows/add-p3-clock-second-hand.yml .github/scripts/add-p3-clock-second-hand.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-src/core.mjs engine-src/runtime.js engine-src/theme.css public/time.html public/engines.html app/api/download/template.ts index.html .github/workflows/add-p3-clock-second-hand.yml .github/scripts/add-p3-clock-second-hand.py
          git commit -m "Add P3 Time clocks with second hand subtopic"
          git push