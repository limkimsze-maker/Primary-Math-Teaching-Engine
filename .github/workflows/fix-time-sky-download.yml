name: Fix Time sky images in SLS ZIP

on:
  push:
    paths:
      - '.github/workflows/fix-time-sky-download.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle Time forest images in downloaded ZIP
        run: |
          python3 .github/scripts/fix-time-sky-download.py
          node --check public/sls-packager.js
          grep -q "TIME_FOREST_ASSET_BUNDLE_V1" public/sls-packager.js
          grep -q "assets/time-forest/morning-sun.webp" public/sls-packager.js
          grep -q "assets/time-forest/afternoon-sun.webp" public/sls-packager.js
          grep -q "assets/time-forest/night-moon.webp" public/sls-packager.js
          grep -q "assets/time-forest/early-morning-moon-owl.webp" public/sls-packager.js
          grep -q "zip.file('index.js',COMPILER_INDEX_JS)" public/sls-packager.js
          grep -q "zip.file('xapiwrapper.min.js',XAPIWRAPPER_MIN_JS)" public/sls-packager.js
          rm -f .github/workflows/fix-time-sky-download.yml .github/scripts/fix-time-sky-download.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sls-packager.js .github/workflows/fix-time-sky-download.yml .github/scripts/fix-time-sky-download.py
          git commit -m "Include Time sky images in downloaded SLS activities"
          git push
